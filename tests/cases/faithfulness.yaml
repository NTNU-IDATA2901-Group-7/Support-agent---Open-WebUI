# Faithfulness tests — does the agent's answer stay grounded in the
# retrieved tool-call context, without inventing facts?
#
# Schema: just `id` + `input`. No expected_keys — faithfulness compares
# the agent's answer against the retrieval_context that was actually
# returned at runtime, so no gold is needed.
#
# Selection: 10 customer-style queries, each hitting a distinct ticket
# cluster — different domains, different cluster sizes.

