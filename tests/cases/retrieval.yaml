# ── Orders in wrong status ─────────────────────────────────────

- id: orders_stuck_sent_to_picking
  # Query about picked orders still stuck with status SENDT TIL PLUKK.
  # SR-15091 (Ordre "Sendt til Plukk" savnes) describes the inverse problem
  # (order missing from the queue, not picked-but-stuck) - IRRELEVANT.
  # Pool: SR-15397 (Vestnes SENDT TIL PLUKK, butikk har mottatt varene),
  #       SR-15554 (Gaula SENDT TIL PLUKK, er plukket),
  #       SR-15489 (OMS 0-qty: ordrestatus blir igjen i SENDT TIL PLUKK),
  #       SR-13306 (Byåsen SENDT TIL PLUKK - older instance of same pattern)
  input: "Ordre er plukket men ligger fortsatt med status SENDT TIL PLUKK"
  expected_keys:
    - SR-15397
    - SR-15554
    - SR-13306
    - SR-15695
    - SR-15091
    - SR-15640

- id: orders_status_header_detail_mismatch
  # Query about orders where header status doesn't match detail-bilde status.
  # Only tickets matching the concrete query statuses (RESERVERT in header,
  # KLAR TIL FAKTURERING in detail, SO pre-invoice flow) qualify as STRONG.
  # SR-15396 (header OB GENERERT) is PARTIAL; SR-15562 is a PO post-invoice
  # settlement issue with different statuses - IRRELEVANT despite shared
  # abstract pattern.
  input: "Ordre står som RESERVERT i header men er KLAR TIL FAKTURERING i detalj"
  expected_keys:
    - SR-15490
    - SR-15511
    - SR-15632

