# Retrieval tests — assertion-based key-based retrieval evaluation.
#
# Each case sends a query through the full agent pipeline and checks that
# the vector search tool returns results containing the expected ticket keys.
#
# Ticket pool: docs/jira-tickets-pool.md (100 most recent closed tickets)
#
# expected_keys: tickets from the pool that are clearly relevant to the query.
# The vector search returns top-5 by cosine similarity, so expected_keys
# should be the tickets most semantically similar to the input query.

# ── Missing packing slip reference (pakkseddelref) ─────────────
# Large cluster: SR-15404, SR-15387, SR-15378, SR-15334, SR-15329,
# SR-15310, SR-15305, SR-15290, SR-15267, SR-15214, SR-15182,
# SR-15183, SR-15160, SR-15126, SR-15101, SR-15089, SR-14960,
# SR-15270, SR-15252, SR-15312

- id: missing_packing_slip_ref_tm
  input: "Butikk mangler pakkseddelreferanse på T&M levering"
  expected_keys:
    - SR-15404
    - SR-15334
    - SR-15310
    - SR-15214
    - SR-15182
    - SR-15305

- id: missing_packing_slip_rdi_cd
  input: "Flere ordrer mangler pakkseddel på RDI CD levering fra Bergen"
  expected_keys:
    - SR-15270
    - SR-15252
    - SR-15312
    - SR-15305

- id: missing_packing_slip_general
  input: "Kunde mangler pakkseddel på levering, ordre ikke fakturert"
  expected_keys:
    - SR-15404
    - SR-15387
    - SR-15378
    - SR-15267
    - SR-15160
    - SR-15089
    - SR-15183
    - SR-14960
    - SR-15126

