# Retrieval tests — assertion-based key-based retrieval evaluation.
#
# Each case sends a query through the full agent pipeline and checks that
# the vector search tool returns results containing the expected ticket keys.
#
# Ticket pool: docs/jira_tickets_list.md (300 most recently updated tickets,
# both open and closed, fetched via paginated /search/jql).
#
# expected_keys: tickets from the pool that are clearly relevant to the query.
# The vector search returns top-5 by hybrid (BM25 + vector) similarity, then
# is reranked by a cross-encoder. The benchmark uses Precision@5, R_cap@5,
# and NDCG@5 — see test_retrieval.py for thresholds.
#
# Case selection: 24 cases spanning 18 distinct support domains. Validated
# against the full 300-ticket pool — narrow single-ticket cases and
# overlapping variants were dropped, expected_keys expanded for clusters
# where additional pool tickets clearly belong.

# ── Missing packing slip reference (pakkseddelref) ─────────────

- id: missing_packing_slip_tm # passes
  # Query about T&M (tobakk/medisin) deliveries missing packing slip ref
  # Pool: SR-15404 (Hell T&M), SR-15310 (OTG T&M), SR-15387 (Rissa tobakk),
  #       SR-15521 (Paul Nyrgaard/Lyngåsen tobakk), SR-15528 (Tp engros tobakk),
  #       SR-15511 (klar til fakturering, mangler pakkseddelref),
  #       SR-15575 (Crossdock-ordrer T&M Kroppanmarka mangler utgående pakkseddel)
  input: "Pakkseddelreferanse mangler på T&M-levering"
  expected_keys:
    - SR-15310
    - SR-15387
    - SR-15521
    - SR-15528
    - SR-15511
    - SR-15575

- id: missing_packing_slip_general # fails badly
  # Query about missing packing slip blocking invoicing — tests whether the
  # retriever surfaces tickets that document the full pakkseddel→fakturering
  # incident chain rather than tickets matching only one symptom.
  # Pool: SR-15575 (Crossdock mangler pakkseddel og fakturering),
  #       SR-15410 (Fanatorget uten pakkseddel, ikke fakturert),
  #       SR-15527 (klar til fakturering, ikke generert pakkseddel ref),
  #       SR-15498 (Tasta ikke fakturert, ikke generert pakkseddelref)
  input: "Mangler pakkseddel på levering, ordre ikke fakturert"
  expected_keys:
    - SR-15575
    - SR-15410
    - SR-15527
    - SR-15498

