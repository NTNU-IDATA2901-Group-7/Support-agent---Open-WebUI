# ── Negative cases (no relevant tickets exist) ─────────────────
# expected_keys is empty: there are no relevant tickets in the corpus.
# Pass states are either (a) the agent declines to search at all, or
# (b) it searches and the similarity cutoff filters everything out.
# Fail state: the agent surfaces tickets despite none being relevant.
# Excluded from aggregate metrics.
#
# Cases span a relevancy gradient — from zero-overlap (different domain)
# to high-overlap (many corpus terms combined into a query with no
# matching ticket). The gradient stresses cutoff calibration: cases at
# the high-overlap end are the hardest filtering challenge.

- id: negative_truck_batteries
  # Out-of-scope operational issue not represented in the corpus.
  # No relevant tickets — agent may skip retrieval, or cutoff filters
  # any surface matches.
  input: "Truckbatteriene tappes raskere enn vanlig på Berger og lader ikke til 100%. Hva kan vi gjøre?"
